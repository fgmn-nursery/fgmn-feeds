name: Build and publish product feeds

on:
  schedule:
    # Every 3 hours. Google fetches on its own schedule, OpenAI expires products
    # 14 days after their last update, and Microsoft expires them after 30 —
    # 3h satisfies all three with a wide margin and keeps price/stock drift small.
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"      # a rules change should publish immediately
      - "src/**"
      - ".github/workflows/**"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml pytest

      # Margin bands are commercially sensitive, so they live in a secret rather
      # than in the repo. Absent, custom_label_4 falls back to "unclassified".
      - name: Materialise margin bands
        env:
          MARGIN_BANDS_CSV: ${{ secrets.MARGIN_BANDS_CSV }}
        run: |
          if [ -n "$MARGIN_BANDS_CSV" ]; then
            printf '%s' "$MARGIN_BANDS_CSV" > config/margin_bands.csv
            echo "margin bands loaded: $(wc -l < config/margin_bands.csv) lines"
          else
            echo "no MARGIN_BANDS_CSV secret set - custom_label_4 will read 'unclassified'"
          fi

      - name: Extract catalog from Shopify
        env:
          # Not a secret - the .myshopify.com domain is public. Kept overridable
          # so a staging store can be pointed at without editing the workflow.
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE || '8a2744-3d.myshopify.com' }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MIN_EXPECTED_PRODUCTS: "100"
        run: python3 src/extract.py

      - name: Rules regression tests
        run: python3 -m pytest tests/ -q

      - name: Build all feeds
        run: |
          python3 src/generate.py --strict
          python3 src/generate.py --segment beneficials --strict

      # Publishing a feed that lost a third of its catalog is worse than
      # publishing nothing — channels delist whatever disappears.
      - name: Guard against catalog collapse
        run: |
          python3 - <<'PY'
          import json, sys
          floors = {"run_report.json": 300, "run_report_beneficials.json": 150}
          bad = False
          for f, floor in floors.items():
              n = json.load(open(f"out/{f}"))["channels"]["google"]["offers"]
              print(f"{f}: {n} offers (floor {floor})")
              if n < floor:
                  print(f"::error::{f} has only {n} offers, expected >= {floor}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Build the Pages site
        run: python3 src/publish.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-output
          path: |
            out/*.xml
            out/*.tsv
            out/*.csv
            out/*.json
          retention-days: 14

      - name: Summarise the run
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print("## Feed build\n")
          for f in ("run_report.json", "run_report_beneficials.json"):
              p = f"out/{f}"
              if not os.path.exists(p):
                  continue
              r = json.load(open(p))
              print(f"### Segment: `{r['segment']}`\n")
              print("| channel | offers | dropped | errors | warnings |")
              print("|---|---|---|---|---|")
              for name, c in r["channels"].items():
                  v = c["validation"]
                  print(f"| {name} | {c['offers']} | {c['dropped']} | {v['errors']} | {v['warnings']} |")
              print()
          r = json.load(open("out/run_report.json"))
          print("### Data-quality warnings to work through\n")
          for code, n in r["channels"]["google"]["validation"]["by_code"].items():
              print(f"- `{code}`: {n}")
          PY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
